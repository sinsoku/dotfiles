[program:givy]
; mise 管理なので shim を叩く。実体パスはアップグレードで変わる
command=%(ENV_HOME)s/.local/share/mise/shims/givy serve %(ENV_HOME)s/ghq/github.com
autostart=true
autorestart=true
; 子プロセスは .zshrc を読まないため PATH を明示する
environment=PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
stdout_logfile=/tmp/givy.log
redirect_stderr=true
